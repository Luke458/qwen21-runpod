name: Build Qwen-Image 2.1 ComfyUI image

# Builds the prebaked RunPod image and pushes it to GHCR.
#
# Triggers:
#   - manual runs (Actions -> Build Qwen-Image 2.1 ComfyUI image -> Run workflow)
#   - pushes touching the Dockerfile, the setup script, or the workflows
#
# After the first successful run, make the GHCR package PUBLIC so RunPod can
# pull it without registry credentials:
#   GitHub -> your profile -> Packages -> qwen21-runpod -> Package settings
#   -> Change visibility -> Public
# Otherwise create a RunPod registry credential and pass containerRegistryAuthId.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "runpod-setup.sh"
      - "patches/**"
      - "workflows/**"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR references must be lowercase; github.repository preserves case.
      - name: Compute image name
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.img.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.image }}:buildcache,mode=max
          provenance: false
